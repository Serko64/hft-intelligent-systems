[project]
name = "hft-intelligent-systems"
version = "0.1.0"
description = "F1 RL Simulator"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pygame>=2.6.1",
    "tensorboard>=2.20.0",
    "stable-baselines3[extra]>=2.8.0",
    "shapely>=2.0.6",
    "osmnx>=1.9.4",
    "pyproj>=3.7.0",
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pywebview>=5.4",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
